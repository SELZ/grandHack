name: grantshak
services:
  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    init: true
    env_file: .env.production
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
      ALLOW_DEV_AUTH: 'false'
      DB_PATH: /app/storage/grants.db
    ports:
      - '127.0.0.1:4000:4000'
    volumes:
      - data:/app/storage
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:4000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }
  bot:
    build:
      context: .
      target: bot
    restart: unless-stopped
    init: true
    env_file: .env.production
    environment:
      API_BASE_URL: http://127.0.0.1:4000
      DEBUG: max:main
    network_mode: service:api
    depends_on:
      api:
        condition: service_healthy
        restart: true
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }
volumes:
  data:
